name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup production environment
        run: |
          if [ -f .env.prod ]; then
            cp .env.prod .env.production
            cp .env.prod .env.local
          fi

      - name: Build static site for GitHub Pages
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /rainning_day_run
          NEXT_PUBLIC_PANDA_RAIN_LEADERBOARD_URL: ${{ secrets.NEXT_PUBLIC_PANDA_RAIN_LEADERBOARD_URL || 'https://script.google.com/macros/s/AKfycbyayumZf8wB3CVNxxkVwGeTZcXyl73In2xyNY-MHEkMUuBjhgMFQJ2Cei5ojRSZtJsh8w/exec' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out_pages

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out_pages
          cname: apink-panda.com
